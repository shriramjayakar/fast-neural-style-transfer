<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fast Neural Style Transfer</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Link to external CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="main-container">
    <div class="title-container">
        <h1 class="custom-title">Fast Neural Style Transfer</h1>
    </div>
    <div class="form-container">
        <form id="uploadForm" class="custom-bg" enctype="multipart/form-data" aria-label="Upload Image Form">
            <input type="file" id="fileInput" accept="image/*" aria-required="true" aria-label="Upload content image" />

            <label for="modelSelect" class="model-label">Choose Model:</label>
            <select id="modelSelect" name="model" required class="model-select">
                <option value="candy">Candy</option>
                <option value="mosaic">Mosaic</option>
                <option value="rain-princess">Rain Princess</option>
                <option value="udnie">U-DNIE</option>
            </select>

            <button type="submit" aria-live="polite">Stylize Image</button>
        </form>
    </div>
</div>




<div id="wavyLoader" class="wavy-loader" role="status" aria-live="polite" aria-atomic="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div id="top-row">
    <!-- Content image and Style image will go here -->
</div>

<div id="bottom-row">
    <!-- Stylized output image will go here -->
</div>


<!-- Link to external JS -->
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
